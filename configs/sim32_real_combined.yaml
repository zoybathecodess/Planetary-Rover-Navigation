# Amendment A4: real-terrain tiles (HiRISE, amendment A2) with the combined-shift physics of configs/sim32_combined_shift.yaml.
# Terrain probabilities are unused (tiles are loaded by seed from external_tiles).
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.35
  p_sand: 0.25
  p_rock: 0.22
  gen_corr: 3
  energy_cost: [1, 4, 6]
  slip_prob: [0.06, 0.25, 0.15]
  sensor_miss: 0.2
  sensor_false: 0.08
  sensor_sigma: 0.15
  external_tiles: data/real_tiles/hirise_tiles.npz
run: {seed: 0}
