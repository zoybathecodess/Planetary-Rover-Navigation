# Amendment A2: in-distribution physics (sensor, slip, energy = configs/sim32_id.yaml) on real-terrain tiles from HiRISE DTMs.
# Terrain probabilities below are unused (tiles are loaded by seed from external_tiles).
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.6
  p_sand: 0.15
  p_rock: 0.1
  gen_corr: 2
  energy_cost: [1, 3, 5]
  slip_prob: [0.02, 0.1, 0.05]
  sensor_miss: 0.05
  sensor_false: 0.02
  sensor_sigma: 0.05
  external_tiles: data/real_tiles/hirise_tiles.npz
run: {seed: 0}
