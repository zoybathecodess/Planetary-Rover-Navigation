# Amendment A4: real-terrain tiles (HiRISE, amendment A2) with the sensor-shift physics of configs/sim32_sensor_shift.yaml.
# Terrain probabilities are unused (tiles are loaded by seed from external_tiles).
env:
  kind: advanced
  size: 32
  battery: 250
  p_normal: 0.6
  p_sand: 0.15
  p_rock: 0.1
  gen_corr: 2
  energy_cost: [1, 3, 5]
  slip_prob: [0.02, 0.1, 0.05]
  sensor_miss: 0.2
  sensor_false: 0.08
  sensor_sigma: 0.15
  external_tiles: data/real_tiles/hirise_tiles.npz
run: {seed: 0}
